# Upstream golang.org/x/net has no GitHub Actions CI (it is tested on the Go
# project's own TryBot/LUCI infrastructure), so this workflow is written from
# scratch. It packages the module zip exactly as the module proxy does and runs
# the project's own test suite (`go test ./...`) on Linux, macOS and Windows.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Go package pattern(s) to test instead of ./...'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      # Build the packaging helper in its own module OUTSIDE the checkout, so
      # `go get` never touches this repository's go.mod/go.sum.
      # x/mod v0.21.0 is the newest release that still builds with Go 1.22.
      - name: Build module-zip helper
        run: |
          set -eux
          HELPER=$(mktemp -d)
          cp "$GITHUB_WORKSPACE/.github/create_mod.go" "$HELPER/"
          cd "$HELPER"
          go mod init example.com/mod
          go get golang.org/x/mod@v0.21.0
          go build -o "$RUNNER_TEMP/create_mod" .

      # golang.org/x/mod/zip skips .git but DESCENDS into .github, so this
      # workflow would otherwise leak into the zip as extra entries that the
      # public proxy artifact does not have. .gitignore and .gitattributes are
      # kept: they ARE part of the published module zip.
      - name: Create module zip
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$GITHUB_WORKSPACE/.github"
          "$RUNNER_TEMP/create_mod" \
            golang.org/x/net v0.30.0 \
            "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/out/v0.30.0.zip"
          unzip -l "$RUNNER_TEMP/out/v0.30.0.zip" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.30.0.zip
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go 1.22 and 1.23 were the supported Go releases when v0.30.0 shipped
          # (2024-10-04); 1.22 is the release-time toolchain. Linux legs run
          # with -race, as the earlier sealed builds of this version did.
          - os: ubuntu-latest
            go: '1.22'
            race: '-race'
          - os: ubuntu-latest
            go: '1.21'
            race: '-race'
          # macOS needs Go >= 1.23: older linkers produce binaries without
          # LC_UUID, which current macOS refuses to run.
          - os: macos-latest
            go: '1.23'
            race: ''
          - os: windows-latest
            go: '1.22'
            race: ''
          # Newest Go (ships Unicode 17): compiles the idna paths gated on the
          # newest Go/Unicode tables, which none of the release-era legs reach.
          - os: ubuntu-latest
            go: '1.27'
            race: '-race'
          # go.mod floor (`go 1.18`): proves the module still compiles, vets
          # and tests on the oldest Go release the module declares support for.
          # Upstream's own http2 *_test.go files import the `slices` package
          # (Go 1.21+), so the http2 TEST binary cannot compile on Go 1.18; the
          # http2 package itself still builds here, and its tests run in full
          # on every other leg.
          - os: ubuntu-latest
            go: '1.18'
            race: ''
            skip-test-pkg: 'golang.org/x/net/http2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Windows would otherwise default to pwsh, where `set -eux` fails.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Download and verify dependencies
        run: |
          set -eux
          go mod download
          go mod verify

      - name: Build
        run: |
          set -eux
          go version
          go build -v ./...

      - name: Vet html
        run: |
          set -eux
          go vet ./html/...

      # -v so every test reports its own PASS/FAIL/SKIP line; the summary at
      # the end states how many tests passed. The exit status of `go test` is
      # propagated unchanged.
      - name: Test
        run: |
          set -euo pipefail
          PKGS='${{ inputs.test-filter || './...' }}'
          SKIP='${{ matrix.skip-test-pkg }}'
          if [ -n "$SKIP" ]; then
            echo "Not testing $SKIP on Go ${{ matrix.go }}: its upstream test files need Go 1.21+ (import \"slices\")."
            PKGS=$(go list $PKGS | grep -vxF "$SKIP" | tr '\n' ' ')
          fi
          go test -v -count=1 -timeout 15m ${{ matrix.race }} $PKGS 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      - name: Test summary
        if: always()
        run: |
          set -eu
          tr -d '\r' < "$RUNNER_TEMP/go-test.log" > "$RUNNER_TEMP/go-test.lf.log"
          awk '
            /^(ok|FAIL|\?)[ \t]/ { print }
            /^ok[ \t]/ { pok++ }
            /^FAIL[ \t]/ { pfail++ }
            /^[ \t]*--- PASS/ { pass++ }
            /^[ \t]*--- FAIL/ { fail++ }
            /^[ \t]*--- SKIP/ { skip++ }
            END {
              print "==== go test summary ===="
              printf "packages ok: %d, packages FAIL: %d\n", pok, pfail
              printf "tests passed: %d, failed: %d, skipped: %d\n", pass, fail, skip
            }
          ' "$RUNNER_TEMP/go-test.lf.log"
          echo "==== Skipped tests with reasons ===="
          # Track the current test from === RUN/CONT/NAME/PAUSE and keep the
          # first indented `file.go:N: msg` line as its reason; print it on
          # every `--- SKIP:`, then a count per reason.
          awk '
            /^=== (RUN|CONT|NAME|PAUSE)/ { cur = $3; next }
            /^[ \t]+[A-Za-z0-9_.-]+\.go:[0-9]+: / {
              if (cur != "" && !(cur in reason)) { m = $0; sub(/^[ \t]+[A-Za-z0-9_.-]+\.go:[0-9]+: /, "", m); reason[cur] = m }
              next
            }
            /^[ \t]*--- SKIP: / {
              name = $3; r = (name in reason) ? reason[name] : "(no message)"
              print "SKIPPED " name " -- reason: " r; cnt[r]++; n++
            }
            END {
              print "==== skip reasons (count) ===="
              for (r in cnt) printf "%6d  %s\n", cnt[r], r
              printf "total skipped: %d\n", n
            }
          ' "$RUNNER_TEMP/go-test.lf.log"
